plugins {
    id 'java'
    id 'io.quarkus' version '3.34.1'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("io.quarkus.platform:quarkus-bom:3.34.1")
    implementation 'ai.timefold.solver:timefold-solver-quarkus:1.32.0'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkus:quarkus-resteasy'
    implementation 'io.quarkus:quarkus-resteasy-jackson'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'net.jodah:expiringmap:0.5.10'
    implementation 'com.google.guava:guava:31.1-jre'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'ai.timefold.solver:timefold-solver-test:1.32.0'
    testImplementation 'ai.timefold.solver:timefold-solver-quarkus-benchmark:1.32.0'
}

configurations.implementation {
    exclude group: 'ai.timefold.solver', module: 'timefold-solver-constraint-drl'
    exclude group: 'ai.timefold.solver', module: 'timefold-solver-constraint-streams-drools'
}

group 'fr.cirad'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

tasks.register("syncVersion") {
    doLast {
        def packageJson = file("src/main/webapp/package.json")
        def content = packageJson.text.replaceFirst(/"version":\s*".*?"/, "\"version\": \"$project.version\"")
        packageJson.text = content

        def readme = file("README.md")
        def versionTag = "v$project.version"
        def readmeContent = readme.text
                .replaceAll(/docker run -p 8080:8080 fgd99\/dicoop:v\S+/,
                        "docker run -p 8080:8080 fgd99/dicoop:$versionTag")
                .replaceAll(/For instance if you want to run Dicoop locally for the version v\S+/,
                        "For instance if you want to run Dicoop locally for the version $versionTag")
        readme.text = readmeContent
    }
}

tasks.register("buildFrontend", Exec) {
    workingDir = file("./src/main/webapp")
    commandLine("pnpm", "run", "build")
}

tasks.register("copyFrontend", Copy) {
    from("src/main/webapp/dist")
    into("src/main/resources/META-INF/resources")
}

processResources {
    dependsOn("copyFrontend")
}

copyFrontend {
    dependsOn("buildFrontend")
}

buildFrontend {
    dependsOn("syncVersion")
}

assemble.dependsOn("copyFrontend")